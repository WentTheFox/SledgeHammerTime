; Pool for the fpm image. Listens on TCP for the nginx container in the same pod; sizing is a starting point (the servers allow 100 children).
[www]
listen = 127.0.0.1:9000
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[session.upload_progress.enabled] = off
