# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# Same steps, same optional setup/deploy-config.sh override mechanism
# (SKIP_HORIZON/SKIP_SSR), same GIT_COMMIT_HASH/GIT_COMMIT_DATE
# build-time env vars. One faithfully-preserved quirk: a pnpm build failure
# does NOT fail the deploy or skip the horizon/pm2 restarts or `artisan up`
# in the original script (the exit code is captured but never checked) —
# kept as-is here rather than silently changing behavior; flag to the user
# if this should actually be fixed.
#
# One deliberate addition beyond the port: a storage/bootstrap-cache
# permission fix after `artisan optimize` (see below) — the old script
# didn't have it, and it was a pre-existing latent bug (the web server
# user couldn't write storage/logs/laravel.log), not something this
# migration introduced. See git-deploy-toolkit's CLAUDE.md pitfalls.
#
# Second addition: this same deploy.conf/pm2.json is shared by more than
# one worktree on the same server (production + a beta staging copy),
# which would otherwise collide on the hardcoded pm2 process name
# ("SledgeHammerTime:SSR") and horizon systemd unit ("horizon.service")
# if both tried to run their own instance. PM2_SSR_NAME and
# HORIZON_SERVICE_NAME below are overridable per-worktree via the same
# untracked setup/deploy-config.sh mechanism SKIP_*/etc. already use —
# defaults match production's pre-existing names exactly, so this is a
# no-op for production; beta's deploy-config.sh sets its own values.
#
# Third addition: whether a target migrates is decided HERE, by an explicit
# allowlist keyed on the bare repo name ($GIT_DIR), not by a flag in the
# untracked deploy-config.sh. Beta shares production's database through a
# read-only role and must never migrate; a SKIP_MIGRATE=true that only lived
# in an untracked file would silently flip back to "migrate" if that file
# were ever lost or recreated. Any target not on the list never migrates -
# fail closed. See git-deploy-toolkit's template/deploy.conf.example,
# "Several deploy targets sharing this file".
#
# `pm2 start pm2.json --name X` does NOT rename the process - pm2 ignores --name when the target is an ecosystem
# file with its own "apps" array and just uses (or matches/restarts!) whatever name is baked into the file.
# Confirmed the hard way: beta's first-ever deploy under a different PM2_SSR_NAME silently restarted PRODUCTION's
# already-running "SledgeHammerTime:SSR" instead of starting a new beta-named one. The SSR process is therefore
# described by a file per target, and the deploy always starts/reloads from that file (pm2_ssr_config below):
# the tracked pm2.json is production's, and a target that needs a different definition (beta: its own name,
# working directory and limits) puts a gitignored pm2.local.json in its shared directory. Reloading from the file,
# rather than by name, is what makes a changed flag (node_args, max_memory_restart, ...) take effect on the next
# deploy; a plain `pm2 reload <name>` keeps the definition the process was started with.

# Zero-downtime mode (git-deploy-toolkit RELEASES=1, see its docs/releases.md):
# the toolkit builds a fresh release dir ($RELEASE, with .env and storage
# linked in via SHARED=(.env storage)) while the old release keeps serving,
# swaps the WORKTREE symlink, then runs deploy_restart. In that mode this
# file never uses `artisan down`: the last step of deploy_build raises the
# read-only flag (storage/framework/readonly, a plain file so it needs no
# PHP), deploy_restart migrates against the already-live new code, restarts
# the workers, checks /status and only then lowers the flag. A failed migrate or
# health check leaves the flag ON on purpose (reads keep working, writes get
# 503) - fix forward or roll back, then `php artisan app:readonly off`.
# Without release dirs ($RELEASE equal to $WORKTREE, in-place mode) the original down/up flow below
# is used unchanged. Migrations must be expand-only relative to the previous
# release; see docs/zero-downtime-deploy.md.

READONLY_FLAG="storage/framework/readonly"

# Paths linked from <WORKTREE>.d/shared into every release (only read by the toolkit when RELEASES=1).
# setup/deploy-config.sh is untracked, so without this it would be missing from every fresh release; the
# file must exist in shared/setup/ (empty is fine).
SHARED=(.env storage setup/deploy-config.sh)

# Release-directory mode: the toolkit builds into $RELEASE while $WORKTREE (a symlink after the swap) still
# points at the old release. In in-place mode the toolkit sets both to the same path. Comparing the two is
# correct from the very first deploy, unlike testing whether $WORKTREE is a symlink yet.
releases_mode() {
  [[ "${RELEASE:-$WORKTREE}" != "$WORKTREE" ]]
}

# Reloads php-fpm so opcache picks up the swapped release; set PHP_FPM_SERVICE (e.g. php8.4-fpm) in setup/deploy-config.sh
reload_php_fpm() {
  if [[ -n "${PHP_FPM_SERVICE:-}" ]]; then
    sudo -n /usr/local/lib/git-deploy/git-deploy-service reload "${PHP_FPM_SERVICE}.service"
  else
    echo "git-deploy: PHP_FPM_SERVICE not set, skipping php-fpm reload (opcache must revalidate paths on its own)"
  fi
}

migrate_if_allowed() {
  case "$(basename "$GIT_DIR")" in
    sledgehammertime.git)
      php artisan migrate --force
      ;;
    *)
      echo "git-deploy: not migrating $(basename "$GIT_DIR") (not in deploy.conf's migrate allowlist)"
      ;;
  esac
}

# Probes the JSON variant of GET /status on the app's own APP_URL (override with HEALTH_URL in setup/deploy-config.sh)
health_check() {
  local url="${HEALTH_URL:-}"
  if [[ -z "$url" ]]; then
    url="$(grep -E '^APP_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"')/status"
  fi
  local attempt
  for attempt in 1 2 3 4 5; do
    if curl -fsS --max-time 10 -H "Accept: application/json" "$url" > /dev/null; then
      echo "git-deploy: health check passed ($url)"
      return 0
    fi
    sleep 3
  done
  echo "git-deploy: health check FAILED ($url)" >&2
  return 1
}

# Which file describes this target's SSR process: pm2.local.json from the shared directory (not tracked, so a target
# can differ from production without a fork of this file; it must set its own "name" - the one in PM2_SSR_NAME -
# and an absolute "cwd", since pm2 resolves a relative script and log path against the directory of the config
# file), then one in the worktree for in-place mode, then the tracked pm2.json. Prints the path.
pm2_ssr_config() {
  local candidate
  for candidate in "${SHARED_DIR:-$WORKTREE.d/shared}/pm2.local.json" "$WORKTREE/pm2.local.json" "$WORKTREE/pm2.json"; do
    if [[ -f "$candidate" ]]; then
      echo "$candidate"
      return 0
    fi
  done
  echo "git-deploy: no pm2 config found for the SSR process" >&2
  return 1
}

deploy_build() {
  SKIP_HORIZON=false
  SKIP_SSR=false
  PM2_SSR_NAME="SledgeHammerTime:SSR"
  HORIZON_SERVICE_NAME="horizon"
  if [[ -f setup/deploy-config.sh ]]; then
    # shellcheck source=/dev/null
    source setup/deploy-config.sh
  fi

  if [[ -d vendor/ ]]; then
    sudo -n /usr/local/lib/git-deploy/git-deploy-fixperms "${RELEASE:-$WORKTREE}" vendor
  fi
  composer install --optimize-autoloader --no-dev

  php artisan optimize

  # public/storage is untracked, so a fresh release dir has none and nginx can not serve /storage/*, such as the
  # self-hosted Google Fonts. Not --relative, that needs symfony/filesystem, a dev dependency. Every release makes its
  # own link, so one pointing into its own directory is fine.
  php artisan storage:link --force

  # artisan optimize/migrate regenerate storage/ and bootstrap/cache/ as
  # this deploy user, which can leave them unwritable by the web server
  # user (www-data) — a real exception on a live request then fails to
  # even log itself (Laravel's generic 500 with nothing in
  # laravel.log). Reassert group ownership/write + setgid so this can't
  # silently regress.
  sudo -n /usr/local/lib/git-deploy/git-deploy-fixperms "${RELEASE:-$WORKTREE}" storage bootstrap/cache

  if ! releases_mode; then
    # In-place mode: migrate before the build, as before
    migrate_if_allowed
  fi

  local changed_files=""
  if [[ "$oldrev" != "0000000000000000000000000000000000000000" ]]; then
    changed_files=$(git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev")
  fi

  # A fresh release dir has no node_modules, so always install there
  if releases_mode || [[ -z "$changed_files" ]] || grep -q "^pnpm-lock\.yaml" <<< "$changed_files"; then
    pnpm install --frozen-lockfile
  else
    echo "git-deploy: skipping pnpm install, lockfile not modified"
  fi

  if ! releases_mode; then
    php artisan down
  fi

  GIT_COMMIT_HASH=$(git --git-dir="$GIT_DIR" rev-parse --short "$newrev")
  GIT_COMMIT_DATE=$(git --git-dir="$GIT_DIR" log -1 --format=%cI "$newrev")
  export GIT_COMMIT_HASH GIT_COMMIT_DATE

  # Faithfully preserved from the original: a build failure here is
  # recorded but never actually checked below, matching the old script's
  # behavior exactly (see file header).
  if releases_mode; then
    # The old release is still live, so a failed build must abort the deploy (set -e)
    pnpm run build
    mkdir -p "$(dirname "$READONLY_FLAG")"
    touch "$READONLY_FLAG"
  else
    pnpm run build || BUILD_EXIT_CODE=$?
  fi
}

deploy_restart() {
  if releases_mode; then
    reload_php_fpm
    # The new code is live and read-only; bring the schema up to date
    migrate_if_allowed
  fi

  if [[ "$SKIP_HORIZON" == "true" ]]; then
    echo "git-deploy: skipping Horizon restart (SKIP_HORIZON=true)"
  else
    sudo -n /usr/local/lib/git-deploy/git-deploy-service restart "${HORIZON_SERVICE_NAME}.service"
  fi

  if [[ "$SKIP_SSR" == "true" ]]; then
    echo "git-deploy: skipping PM2/SSR restart (SKIP_SSR=true)"
  else
    # The SSR bundle is a plain Node script (what `inertia:start-ssr` runs), so pm2 can cluster it like
    # Celestia: workers share the port and a reload restarts them one at a time, so rendering keeps working
    # during a restart. pm2 cannot cluster `php artisan`, hence the bundle is started directly. The process,
    # its limits and its logs (storage/ is shared between releases, so they and their rotation by
    # deploy.logrotate outlive a release) are defined in the config file, see pm2_ssr_config.
    SSR_BUNDLE="$WORKTREE/bootstrap/ssr/ssr.js"
    PM2_SSR_CONFIG="$(pm2_ssr_config)" || return 1
    echo "git-deploy: SSR process $PM2_SSR_NAME from $PM2_SSR_CONFIG"
    # A process still defined the old way (fork mode running artisan, or another script) is deleted and started
    # again once; pm2 can not turn it into a cluster by reloading. Compared as a substring of `pm2 jlist` (a pipe
    # into grep -q would trip pipefail via SIGPIPE).
    if pm2 describe "$PM2_SSR_NAME" > /dev/null 2>&1 && [[ "$(pm2 jlist 2> /dev/null)" != *"\"pm_exec_path\":\"$SSR_BUNDLE\""* ]]; then
      echo "git-deploy: $PM2_SSR_NAME is not the clustered SSR bundle yet (one-time delete + start)"
      pm2 delete "$PM2_SSR_NAME"
    fi
    # Starts it when missing, otherwise reloads the workers one at a time with the definition from the file.
    # Note: a changed "instances" is not applied by a reload; delete the process once to resize it.
    pm2 startOrReload "$PM2_SSR_CONFIG" --only "$PM2_SSR_NAME"
    pm2 save
  fi

  php artisan app:clear-page-cache
  if releases_mode; then
    health_check
    rm -f "$READONLY_FLAG"
  else
    php artisan up
  fi
}

# git-deploy-rollback: the toolkit has already re-pointed the symlink. Never runs deploy_restart (it
# migrates) and never touches the flag or the schema, so only reload what serves the code.
deploy_rollback() {
  SKIP_HORIZON=false
  HORIZON_SERVICE_NAME="horizon"
  if [[ -f setup/deploy-config.sh ]]; then
    # shellcheck source=/dev/null
    source setup/deploy-config.sh
  fi
  reload_php_fpm
  if [[ "$SKIP_HORIZON" != "true" ]]; then
    sudo -n /usr/local/lib/git-deploy/git-deploy-service restart "${HORIZON_SERVICE_NAME}.service"
  fi
  if [[ "${SKIP_SSR:-false}" != "true" ]]; then
    pm2 reload "${PM2_SSR_NAME:-SledgeHammerTime:SSR}"
  fi
}
