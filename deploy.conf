# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from this repo's old setup/post-receive.sh (a hand-rolled hook on
# a non-bare `production` remote with receive.denyCurrentBranch=updateInstead).
# Same steps, same optional setup/deploy-config.sh override mechanism
# (SKIP_MIGRATE/SKIP_HORIZON/SKIP_SSR), same GIT_COMMIT_HASH/GIT_COMMIT_DATE
# build-time env vars. One faithfully-preserved quirk: a pnpm build failure
# does NOT fail the deploy or skip the horizon/pm2 restarts or `artisan up`
# in the original script (the exit code is captured but never checked) —
# kept as-is here rather than silently changing behavior; flag to the user
# if this should actually be fixed.
#
# One deliberate addition beyond the port: a storage/bootstrap-cache
# permission fix after `artisan optimize` (see below) — the old script
# didn't have it, and it was a pre-existing latent bug (the web server
# user couldn't write storage/logs/laravel.log), not something this
# migration introduced. See git-deploy-toolkit's CLAUDE.md pitfalls.
#
# Second addition: this same deploy.conf/pm2.json is shared by more than
# one worktree on the same server (production + a beta staging copy),
# which would otherwise collide on the hardcoded pm2 process name
# ("SledgeHammerTime:SSR") and horizon systemd unit ("horizon.service")
# if both tried to run their own instance. PM2_SSR_NAME and
# HORIZON_SERVICE_NAME below are overridable per-worktree via the same
# untracked setup/deploy-config.sh mechanism SKIP_*/etc. already use —
# defaults match production's pre-existing names exactly, so this is a
# no-op for production; beta's deploy-config.sh sets its own values.

deploy_build() {
  SKIP_MIGRATE=false
  SKIP_HORIZON=false
  SKIP_SSR=false
  PM2_SSR_NAME="SledgeHammerTime:SSR"
  HORIZON_SERVICE_NAME="horizon"
  if [[ -f setup/deploy-config.sh ]]; then
    # shellcheck source=/dev/null
    source setup/deploy-config.sh
  fi

  if [[ -d vendor/ ]]; then
    sudo chmod -R ug+rw vendor/
  fi
  composer install --optimize-autoloader --no-dev

  php artisan optimize

  # artisan optimize/migrate regenerate storage/ and bootstrap/cache/ as
  # this deploy user, which can leave them unwritable by the web server
  # user (www-data) — a real exception on a live request then fails to
  # even log itself (Laravel's generic 500 with nothing in
  # laravel.log). Reassert group ownership/write + setgid so this can't
  # silently regress.
  sudo chgrp -R www-data storage bootstrap/cache
  sudo chmod -R ug+rw storage bootstrap/cache
  sudo find storage bootstrap/cache -type d -exec chmod g+s {} \;

  if [[ "$SKIP_MIGRATE" == "true" ]]; then
    echo "git-deploy: skipping migrations (SKIP_MIGRATE=true)"
  else
    php artisan migrate --force
  fi

  local changed_files=""
  if [[ "$oldrev" != "0000000000000000000000000000000000000000" ]]; then
    changed_files=$(git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev")
  fi

  if [[ -z "$changed_files" ]] || grep -q "^pnpm-lock\.yaml" <<< "$changed_files"; then
    pnpm install --frozen-lockfile
  else
    echo "git-deploy: skipping pnpm install, lockfile not modified"
  fi

  php artisan down

  GIT_COMMIT_HASH=$(git --git-dir="$GIT_DIR" rev-parse --short "$newrev")
  GIT_COMMIT_DATE=$(git --git-dir="$GIT_DIR" log -1 --format=%cI "$newrev")
  export GIT_COMMIT_HASH GIT_COMMIT_DATE

  # Faithfully preserved from the original: a build failure here is
  # recorded but never actually checked below, matching the old script's
  # behavior exactly (see file header).
  pnpm run build || BUILD_EXIT_CODE=$?
}

deploy_restart() {
  if [[ "$SKIP_HORIZON" == "true" ]]; then
    echo "git-deploy: skipping Horizon restart (SKIP_HORIZON=true)"
  else
    sudo systemctl restart "${HORIZON_SERVICE_NAME}.service"
  fi

  if [[ "$SKIP_SSR" == "true" ]]; then
    echo "git-deploy: skipping PM2/SSR restart (SKIP_SSR=true)"
  else
    # pm2.json hardcodes the process name; override it so a second
    # worktree using this same file doesn't collide with the first
    # one's already-running process.
    if pm2 describe "$PM2_SSR_NAME" > /dev/null 2>&1; then
      pm2 restart "$PM2_SSR_NAME"
    else
      pm2 start pm2.json --name "$PM2_SSR_NAME"
    fi
  fi

  php artisan app:clear-page-cache
  php artisan up
}
