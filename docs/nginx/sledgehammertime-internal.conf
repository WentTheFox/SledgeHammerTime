# The API service's way into the internal endpoints (see docs/api.md), for hammertime.vps at
# /etc/nginx/sites-available/sledgehammertime-internal.conf (symlinked into sites-enabled).
#
# It only exists on 127.0.0.1 and only serves /internal, so those endpoints are never reachable from the internet
# and nothing depends on an address allowlist behind Cloudflare. The API service's .env.api points LARAVEL_URL here.

server {
    listen 127.0.0.1:8088;
    server_name _;
    root /var/www/SledgeHammerTime/public;
    error_log /var/www/SledgeHammerTime/storage/logs/nginx-error.log;

    location ^~ /internal/ {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 15;
    }

    location / {
        return 404;
    }
}
