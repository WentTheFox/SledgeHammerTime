# For /etc/nginx/snippets/block-internal.conf, included in the public vhost (hammertime.cyou) next to
# block-multipart.conf: the internal endpoints (docs/api.md) are not served to the internet at all, the API service
# uses the loopback listener in sledgehammertime-internal.conf. A second lock, the endpoints also need the shared secret.

location ^~ /internal/ {
    return 404;
}
