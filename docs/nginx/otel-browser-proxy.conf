# Same-origin transport for the browser (OpenTelemetry) spans, so there is no extra public hostname.
# Include in the `http` block (limit_req_zone) and the public `server` block (location) of the web container's nginx.
# The app only sends here when BROWSER_TRACING_ENABLED=true (default endpoint: /_otel/v1/traces).

limit_req_zone $binary_remote_addr zone=otel_browser:1m rate=10r/s;

# server {
#   # kube-dns, see /etc/resolv.conf of the pod. A variable in proxy_pass keeps nginx starting without the collector
#   resolver 10.96.0.10 valid=10s ipv6=off;
#
  location = /_otel/v1/traces {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    limit_req zone=otel_browser burst=20 nodelay;
    limit_req_status 429;

    set $otel_collector http://otel-collector.monitoring.svc.cluster.local:4318;
    proxy_pass $otel_collector/v1/traces;
    proxy_http_version 1.1;
    proxy_set_header Host otel-collector.monitoring.svc.cluster.local;
    # nothing identifying is forwarded: no cookies, no Authorization, no client IP
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    access_log off;
  }
# }
