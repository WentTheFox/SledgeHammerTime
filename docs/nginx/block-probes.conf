# For /etc/nginx/snippets/block-probes.conf, included in the public vhost (hammertime.cyou) next to
# block-internal.conf: scanners request login/signup paths this app does not have (usually under every locale prefix),
# and every such 404 is a full app + SSR render of the NotFound page (1-2.5s each, measured with the main_ext log's rt=).
# Answering them here costs nothing. Nothing in the app routes these paths - if one is ever added, drop it from here.
# apple-touch-icon is requested by iOS for every page, with the locale prefix, and is not served either.

location ~* "^(/[a-z]{2,3}(-[a-z0-9]+)?)?/(signup|sign-in|forgot-password|users/login|auth(/login)?|admin/login|account/login|apple-touch-icon[^/]*\.png)$" {
    return 404;
}
