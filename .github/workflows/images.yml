name: Publish container images

# Publishes the three images (fpm, web, ssr), multi-arch, to ghcr.io for EVERY push to main, tagged <sha7> and
# sha-<sha7>. When the push also carries a version bump according to the conventional commits since the last tag
# (feat -> minor, fix -> patch, breaking -> major; docs/ci/chore only bump nothing), the release tags (<version>,
# latest) are added and the git tag is created; non-release commits never move `latest` nor create a version. The same images serve prod and beta; environment
# differences are runtime configuration only. No build inputs: the VITE_* values the frontend reads are non-secret
# defaults in docker/Dockerfile.
#
# The sha-<sha7> tag is what Argo CD Image Updater follows. It is added to all three manifest lists as the very last
# registry step, so it never exists on a partial set (fpm/web/ssr of one commit appear together).
#
# Each architecture is built natively on its own runner (no qemu emulation, which makes the PHP extension compile
# take far too long), pushed as <sha7>-<arch>, then merged into one multi-arch tag per image.
on:
  push:
    branches: [ main ]

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  commitlint:
    name: 'Lint commit messages'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  version:
    name: 'Compute next version'
    needs: commitlint
    runs-on: ubuntu-24.04
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dry_run: compute the next version without creating/pushing the tag yet. The tag is only created once the
      # images have actually been published, so a failed build never leaves a version tag with no images.
      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

  build:
    name: 'Build ${{ matrix.arch }}'
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out names and tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tag }}
          GIT_COMMIT_HASH: ${{ steps.meta.outputs.sha }}
          GIT_COMMIT_DATE: ${{ steps.meta.outputs.date }}
        with:
          files: docker/docker-bake.hcl
          push: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=${{ matrix.arch }}
            *.cache-to=type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    name: 'Publish multi-arch tags'
    needs: [ version, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        env:
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sha="${GITHUB_SHA:0:7}"
          for image in fpm web ssr; do
            repo="$registry/sledgehammertime-$image"
            tags=(-t "$repo:$sha")
            if [ -n "$NEW_VERSION" ]; then
              tags+=(-t "$repo:$NEW_VERSION" -t "$repo:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$repo:$sha-amd64" "$repo:$sha-arm64"
          done

      # Last registry step: only now that all three multi-arch manifest lists exist is the tag Image Updater follows
      # added (re-pointing the already-pushed manifest list, no rebuild), so it never exists on a partial set.
      - name: Add sha- tag to all three images
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sha="${GITHUB_SHA:0:7}"
          for image in fpm web ssr; do
            repo="$registry/sledgehammertime-$image"
            docker buildx imagetools inspect "$repo:$sha" > /dev/null
          done
          for image in fpm web ssr; do
            repo="$registry/sledgehammertime-$image"
            docker buildx imagetools create -t "$repo:sha-$sha" "$repo:$sha"
          done

      - name: Tag release
        if: needs.version.outputs.new_tag != ''
        run: |
          git tag ${{ needs.version.outputs.new_tag }}
          git push origin ${{ needs.version.outputs.new_tag }}
