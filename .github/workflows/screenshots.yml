name: Create Useful Link Screenshots

on:
  workflow_dispatch:

env:
  PLAYWRIGHT_VERSION: 1.64.0
  BRANCH: update-useful-link-screenshots
  OUTPUT_DIR: resources/img/screenshots

jobs:
  screenshots:
    name: Take screenshots
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pw/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      # The browser binaries are cached, the OS libraries they need are not
      - name: Download Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Take screenshots
        run: node .github/scripts/screenshots.cjs
        env:
          USER_AGENT: 'Mozilla/5.0 (compatible; ScreenshotsWorkflow; +${{ github.server_url }}/${{ github.repository }}; run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'

      # "!" ignores the aspect ratio so the size is exact
      - name: Resize screenshots
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          mogrify -resize '604x340!' "$OUTPUT_DIR"/*.png

      - name: Push screenshots to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -f -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo 'No screenshot changes to commit'
            exit 0
          fi
          git commit -m 'Update website screenshots'
          git push --force-with-lease origin "$BRANCH"
