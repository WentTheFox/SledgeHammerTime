name: Build

# Pushes to main and beta are not a trigger here: images.yml calls this workflow (workflow_call) and only builds the container images
# when it succeeds, so a failing lint, PHPStan or test run never produces images.
on:
  pull_request:
    branches: [ main ]
  workflow_call:

# A newer run on the same ref cancels the older one. From images.yml that only ever cancels the tests of an older commit, so that commit gets
# no images at all; once its image jobs have started nothing can cancel them (see the comment in images.yml)
concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 'Building, Linting and Tests'
    runs-on: ubuntu-24.04
    # Runs take about 5 minutes; a hung browser test would otherwise hold the job for the 6 hour default
    timeout-minutes: 20
    env:
      CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
      CROWDIN_PROJECT_IDENTIFIER: ${{ vars.CROWDIN_PROJECT_IDENTIFIER }}
    services:
      # The bot settings are cached in Redis (DiscordUserService), which the settings, API key and login tests go through
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy-window test diffs database/migrations against the base branch
          fetch-depth: 0

      - run: git config --global --add safe.directory /app

      - uses: ./.github/actions/setup

      - run: pnpm run lint

      - run: pnpm run test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github

      - name: Run unit and feature tests
        run: php artisan test --filter="Unit|Feature"

      - name: Run deploy-window tests (new code on the previous release's schema)
        run: php artisan test --group=deploy-window
        env:
          DEPLOY_BASE_REF: origin/${{ github.base_ref || 'main' }}

  # One job per browser, running side by side once lint-and-test (including PHPStan) has passed; each has its own runner, database and Redis
  browser-tests:
    name: 'Browser tests (${{ matrix.browser }})'
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [ firefox, chrome ]
    env:
      CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
      CROWDIN_PROJECT_IDENTIFIER: ${{ vars.CROWDIN_PROJECT_IDENTIFIER }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: git config --global --add safe.directory /app

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run browser tests (in ${{ matrix.browser }})
        run: php artisan test --filter="Browser" --browser ${{ matrix.browser }} -vvv
        env:
          # Set here because phpunit.xml applies its env after the autoloader has registered the hooks; the app runs inside a
          # fiber in these tests, where the hooks cannot read the OpenTelemetry context and only log warnings
          OTEL_PHP_DISABLED_INSTRUMENTATIONS: all
