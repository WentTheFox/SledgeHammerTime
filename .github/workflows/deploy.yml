# "Sync to production" button for SledgeHammerTime production.
#
# Images are built by the other workflows; the Rathalos cluster's Argo CD deploys beta by itself, but production is only changed on purpose.
# This workflow is that purpose: running it makes GitHub send a signed `workflow_run` webhook (event `workflow_run`, action `requested`) to the
# receiver in the cluster (https://webhook.hammertime.cyou, Rathalos repo platform/deploy-hook). The receiver checks the signature, that this
# is the Deploy workflow started by hand (workflow_dispatch) on main, and then asks Argo CD to sync the Application `sledgehammertime-prod`
# (the same as pressing Sync in the Argo CD UI, including the migrate hook where the app has one). It cannot choose an image, revision or
# application. Nothing is stored in GitHub Actions secrets and no deployment record or environment is created: the job below only gives the
# run something to show. The result is visible in Argo CD and in the "production" deployment records its notifications write.
#
# workflow_dispatch only, never automatic: syncing production is always a deliberate decision.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Sync requested
        run: echo "Sync of sledgehammertime-prod requested; the cluster receiver acts on GitHub's workflow_run webhook for this run."
