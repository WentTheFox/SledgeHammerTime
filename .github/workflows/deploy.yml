# Manual "Sync to production" button for SledgeHammerTime production.
#
# Production deploys by itself: every push to main builds the images (images.yml, after the tests pass), the Rathalos cluster's
# Argo CD Image Updater follows the sha-<sha7> tag, and Argo CD syncs `sledgehammertime-prod`; the smoke test then runs against the
# live site (smoke.yml). Beta works the same way from the `beta` branch (beta-sha-<sha7> tags), which is where a change should be
# proven before it reaches main.
#
# This workflow is only for syncing on demand, without a new image (the same as pressing Sync in the Argo CD UI, including the migrate
# hook where the app has one). Running it makes GitHub send a signed `workflow_run` webhook (event `workflow_run`, action `requested`)
# to the receiver in the cluster (https://webhook.hammertime.cyou, Rathalos repo platform/deploy-hook). The receiver checks the
# signature, that this is the Deploy workflow started by hand (workflow_dispatch) on main, and then asks Argo CD to sync the
# Application `sledgehammertime-prod`. It cannot choose an image, revision or application. Nothing is stored in GitHub Actions secrets
# and no deployment record or environment is created: the job below only gives the run something to show. The result is visible in
# Argo CD and in the "production" deployment records its notifications write.
#
# workflow_dispatch only, never triggered by a push.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Sync requested
        run: echo "Sync of sledgehammertime-prod requested; the cluster receiver acts on GitHub's workflow_run webhook for this run."
