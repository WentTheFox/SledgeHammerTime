# Post-deploy smoke test for production (https://hammertime.cyou): fails when the live site is broken.
#
# The Deploy workflow only asks the cluster's Argo CD to sync, and finishes BEFORE the new version is live (PreSync migrate, rolling
# update, PostSync page cache clear: ~1-3 minutes). So this waits until the running build (`build` in the JSON /status, the short
# commit hash baked into the image) is the one that was deployed, and only then runs tests/smoke/smoke.cjs against the live site.
#
# Waiting is a poll on purpose: nothing tells GitHub when the sync finished. (An Argo CD notification that sends a
# repository_dispatch after PostSync would make it event driven.)
#
# Manual run: optionally give the commit to wait for; without it the checks run against whatever is live right now.
name: Smoke test

on:
  workflow_run:
    workflows: [ Deploy ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit (full or short hash) prod must be running before testing; empty tests whatever is live'
        required: false
        type: string

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.64.0
  BASE_URL: https://hammertime.cyou
  WAIT_TIMEOUT_SECONDS: 600
  WAIT_INTERVAL_SECONDS: 15

jobs:
  smoke:
    name: Smoke test production
    # A failed Deploy has nothing to verify
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for production to run the deployed build
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No commit to wait for, testing whatever is live."
            exit 0
          fi
          expected="${EXPECTED_SHA:0:7}"
          deadline=$((SECONDS + WAIT_TIMEOUT_SECONDS))
          running=unreachable
          while :; do
            running=$(curl -fsS --max-time 10 -H 'Accept: application/json' -A 'SledgeHammerTime-Smoke' "$BASE_URL/status" | jq -r '.build // "not reported"') || running=unreachable
            if [ "$running" = "$expected" ]; then
              echo "Production is running $expected"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Prod still on $running, expected $expected after ${WAIT_TIMEOUT_SECONDS}s"
              exit 1
            fi
            echo "Production is on $running, waiting for $expected"
            sleep "$WAIT_INTERVAL_SECONDS"
          done

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pw/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      # The browser binaries are cached, the OS libraries they need are not
      - name: Download Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run smoke checks
        run: node tests/smoke/smoke.cjs
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/smoke-artifacts

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failures
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
          retention-days: 14
