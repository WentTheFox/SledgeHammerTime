# Smoke test for a live SledgeHammerTime environment (production https://hammertime.cyou, beta https://beta.hammertime.cyou): fails when
# the live site is broken.
#
# Triggered by the GitHub *deployment status* that Argo CD Notifications writes for every sync (webhook-triggered, manual or beta's
# automatic one). The notification fires only when the sync finished AND the app is Healthy, PostSync hooks included, so the new version
# is live by the time this runs: no waiting for the rollout. (deployment_status workflows always run from the default branch.)
# It then runs tests/smoke/smoke.cjs against the environment_url of the deployment.
#
# Manual run: optionally give the commit the site must be running and/or another URL; without a sha the checks run against whatever is live.
name: Smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit (full or short hash) the site must be running before testing; empty tests whatever is live'
        required: false
        type: string
      url:
        description: 'Site to test'
        required: false
        default: https://hammertime.cyou
        type: string

concurrency:
  group: smoke-${{ github.event.deployment.environment || inputs.url || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.64.0

jobs:
  smoke:
    name: Smoke test ${{ github.event.deployment.environment || 'site' }}
    # Argo CD also reports in_progress/failure states, only a successful, healthy sync is worth testing
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the environment is running the deployed build
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          EXPECTED_SHA: ${{ github.event.deployment.sha || inputs.sha }}
        run: |
          # The URL ends up in a browser run by this job, so only our own sites are accepted
          if ! [[ "$SITE_URL" =~ ^https://(beta\.)?hammertime\.cyou/?$ ]]; then
            echo "::error::Refusing to test unexpected URL '$SITE_URL'"
            exit 1
          fi
          echo "BASE_URL=${SITE_URL%/}" >> "$GITHUB_ENV"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No commit to check, testing whatever is live."
            exit 0
          fi
          # Argo already reported the sync healthy; this only absorbs Cloudflare/ingress settling
          expected="${EXPECTED_SHA:0:7}"
          running=unreachable
          for attempt in $(seq 1 12); do
            running=$(curl -fsS --max-time 10 -H 'Accept: application/json' -A 'SledgeHammerTime-Smoke' "${SITE_URL%/}/status" | jq -r '.build // "not reported"') || running=unreachable
            if [ "$running" = "$expected" ]; then
              echo "$SITE_URL is running $expected"
              exit 0
            fi
            echo "$SITE_URL is on $running, expected $expected (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::${SITE_URL} still on $running, expected $expected"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install "playwright@$PLAYWRIGHT_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pw/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      # The browser binaries are cached, the OS libraries they need are not
      - name: Download Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run smoke checks
        run: node tests/smoke/smoke.cjs
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/smoke-artifacts

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failures
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
          retention-days: 14
