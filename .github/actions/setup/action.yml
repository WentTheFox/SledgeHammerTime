name: Set up the app for CI
description: PHP, Composer, pnpm and Node dependencies, frontend build, .env, PostgreSQL and migrations

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: 8.5
        extensions: bcmath, intl, pcntl, pdo_pgsql, opentelemetry

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist
      shell: bash
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
    - name: pnpm run build
      run: pnpm run build
      shell: bash

    - name: Prepare .env
      shell: bash
      run: |
        cp .env.example .env
        # Configure Laravel to use built-in PostgreSQL
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=laravel_test/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=hunter2/' .env
    - name: Generate app key
      run: php artisan key:generate
      shell: bash
    - name: Start built-in PostgreSQL
      shell: bash
      run: |
        sudo systemctl start postgresql.service
        sudo systemctl status postgresql.service
        sudo -u postgres psql -c "CREATE DATABASE laravel_test;"
        sudo -u postgres psql -c "CREATE USER laravel_test PASSWORD 'hunter2' SUPERUSER;"
    - name: Run migrations
      run: php artisan migrate --force
      shell: bash
