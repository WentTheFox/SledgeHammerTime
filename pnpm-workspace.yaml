minimumReleaseAge: 20160

# Our own forks and packages are published by us and used right away, not after the quarantine for third-party releases
minimumReleaseAgeExclude:
  - '@wentthefox-forks/*'
  - '@went.tf/hammertime-css'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  protobufjs: false
  '@datadog/pprof': false

overrides:
  brace-expansion: '>=5.0.12'
  file-type: '>=21.3.1'
  '@vitest/mocker': '>=4.1.12'
