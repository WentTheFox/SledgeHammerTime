; Dedicated php-fpm for the local dev vhost (hammertime.lc), started by hammertime-fpm.service
; under git-deploy-run so the Infisical secrets exist only in this process tree.
;
; Not the system-wide php8.5-fpm: that one is shared with other projects (When), which would
; inherit these secrets, and real environment variables beat their own .env.

[global]
pid = /run/hammertime-fpm/php-fpm.pid
error_log = /home/seinopsys/git/WentTheFox/SledgeHammerTime/storage/logs/php-fpm.log
daemonize = no

[hammertime]
; The master runs as seinopsys (git-deploy-run drops privileges), so user/group are not set here
; and the socket stays owned by seinopsys, which is also the user nginx runs as locally.
listen = /run/hammertime-fpm/fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Without this FPM strips the master's environment and Laravel would see no secrets at all.
clear_env = no
catch_workers_output = yes
