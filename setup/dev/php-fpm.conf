; Dedicated php-fpm for the local dev vhost (hammertime.lc), run by `pnpm dev:php` through
; setup/dev/with-secrets.sh, so the OpenBao secrets exist only in this process tree and the worker
; processes it spawns. Runs as the current user: nothing here needs root.
;
; Not the system-wide php-fpm: that one is shared with other projects (When), which would inherit these
; secrets, and real environment variables beat their own .env.

[global]
; Writable fallback; `-O` in dev:php forces the output to the terminal running `pnpm dev` instead.
error_log = ${XDG_RUNTIME_DIR}/hammertime-fpm.log
daemonize = no

[hammertime]
; The nginx vhost's fastcgi_pass must be unix:/run/user/<uid>/hammertime-fpm.sock (nginx runs as the same
; user locally, so the socket owner can connect).
listen = ${XDG_RUNTIME_DIR}/hammertime-fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Without this FPM strips the master's environment and Laravel would see no secrets at all.
clear_env = no
catch_workers_output = yes
